[project]
name = "ps5-agent-handler"
version = "0.1.0"
description = "Drive the Claude desktop app's Code tab with a PS5 DualSense controller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.10 ; sys_platform == 'win32'",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "pyobjc-framework-applicationservices>=10 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10 ; sys_platform == 'darwin'",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30",
    "sounddevice>=0.4.6",
]

[project.scripts]
ps5-agent = "ps5_agent_handler.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
